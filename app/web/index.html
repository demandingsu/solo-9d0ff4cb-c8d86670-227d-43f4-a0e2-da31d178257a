<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天平采集 - 实验室称量系统</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>⚖️ 实验室天平采集系统</h1>
    <nav>
      <a href="/" class="active">实时采集</a>
      <a href="/static/records.html">称量记录</a>
    </nav>
    <div class="header-status" id="header-status"></div>
  </header>

  <main>
    <!-- 左列：实时重量与状态 -->
    <section class="card col-4">
      <h2>实时重量</h2>
      <div class="weight-box">
        <div>
          <span class="weight-value" id="weight-value">----</span>
          <span class="weight-unit">g</span>
        </div>
        <div class="weight-meta">
          <span class="badge info" id="badge-phase">—</span>
          <span class="badge" id="badge-stable">—</span>
          <span class="badge" id="badge-conn">—</span>
        </div>
      </div>
      <div class="kv" style="margin-top: 14px">
        <span class="k">已选样品</span><span class="v" id="kv-selected">—</span>
        <span class="k">锁定样品</span><span class="v" id="kv-locked">—</span>
        <span class="k">是否已记录</span><span class="v" id="kv-recorded">—</span>
        <span class="k">入库尝试次数</span><span class="v" id="kv-attempts">0</span>
        <span class="k">最近读数时间</span><span class="v" id="kv-reading-at">—</span>
        <span class="k">最近错误</span><span class="v" id="kv-error" style="color: var(--red)">—</span>
      </div>
      <div class="locked-note hidden" id="locked-note">
        🔒 样品已锁定：稳定回零前不能更换样品；同一样品只允许记一条，重复稳定读数不会重复入库。
      </div>
    </section>

    <!-- 中列：样品选择 + 模拟器控制 -->
    <section class="card col-4">
      <h2>样品选择</h2>
      <label for="sample-select">选择本次称量样品</label>
      <select id="sample-select">
        <option value="">加载中…</option>
      </select>
      <div class="btn-row">
        <button class="primary" id="btn-select">确认选择样品</button>
      </div>
      <div class="locked-note hidden" id="select-locked-note">
        当前样品锁定中，请先在模拟器上“回零”并等待稳定零位后再换样。
      </div>

      <h2 style="margin-top: 22px">天平模拟器控制</h2>
      <label for="place-weight">放样重量（克，正数）</label>
      <input id="place-weight" type="number" step="0.0001" min="0.0001" value="12.5000" />
      <div class="btn-row">
        <button class="primary" id="btn-place">① 放样（稳定正重量）</button>
      </div>
      <div class="btn-row">
        <button class="warn" id="btn-jitter-on">② 开抖动</button>
        <button id="btn-jitter-off">关抖动（恢复稳定）</button>
      </div>
      <div class="btn-row">
        <button id="btn-zero">③ 回零（稳定 0 g）</button>
      </div>
      <div class="btn-row">
        <button id="btn-frag-on">拆包模式 开</button>
        <button id="btn-frag-off">拆包模式 关</button>
      </div>
      <div class="btn-row">
        <button class="danger" id="btn-disconnect">断线</button>
        <button class="primary" id="btn-reconnect">恢复连接</button>
      </div>

      <h2 style="margin-top: 22px">故障演示（入库失败重试）</h2>
      <div class="btn-row">
        <button class="danger" id="btn-fail-on">接下来 3 次写入强制失败</button>
        <button id="btn-fail-off">取消故障注入</button>
      </div>
      <p style="font-size: 12px; color: var(--muted); margin: 8px 0 0">
        开启后放样：记录会入库失败但样品保持锁定，后续每次稳定读数自动重试；
        成功前不会被标记为已记，也不会产生部分记录。
      </p>
    </section>

    <!-- 右列：服务端事件日志 -->
    <section class="card col-4">
      <h2>服务端采集事件（所有页面共享）</h2>
      <div class="event-log" id="event-log">
        <div class="empty">暂无事件</div>
      </div>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
